<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found · Sushant Nagil</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#030409">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --bg: #030409;
    --text: #eef2fa;
    --text-2: #8e9ab3;
    --accent: #7cc4ff;
    --mono: ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --body: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid; place-items: center;
    padding-inline: 20px;
    background: radial-gradient(ellipse 50% 40% at 50% 45%, rgba(124, 196, 255, 0.07), transparent 70%), var(--bg);
    color: var(--text);
    font-family: var(--body);
    text-align: center;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .code { font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.3em; color: var(--accent); }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.4rem); font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
  p { margin: 0; color: var(--text-2); }
  a {
    margin-top: 8px;
    padding: 12px 22px;
    border: 1px solid rgba(124, 196, 255, 0.35);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
  }
  a:hover, a:focus-visible { border-color: var(--accent); background: rgba(124, 196, 255, 0.08); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>This page doesn't exist.</h1>
  <p>The link may be old, or the address may have a typo.</p>
  <a href="/">Back to the homepage</a>
</main>
</body>
</html>
